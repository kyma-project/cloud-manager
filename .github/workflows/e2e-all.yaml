name: E2E All Providers

on:
  schedule:
    - cron: '37 4 * * 1-5'
  workflow_dispatch:
    inputs:
      aws:
        type: boolean
        required: false
        default: true
        description: AWS
      azure:
        type: boolean
        required: false
        default: true
        description: Azure
      gcp:
        type: boolean
        required: false
        default: true
        description: GCP
      alicloud:
        type: boolean
        required: false
        default: true
        description: AliCloud
      tags:
        type: string
        required: false
        description: |
          Godog tags (provider automatically appended)
      feature_flags:
        type: choice
        required: true
        options:
          - ./pkg/feature/ff_edge.yaml
          - ./pkg/feature/ff_ga.yaml
        description: Feature flag file
      debug:
        type: boolean
        description: Extra logs and prints
        default: false
      notify:
        type: choice
        required: false
        options:
          - default
          - "yes"
          - "no"
        default: default
        description: |
          Send Slack notification: 'default' sends only from the canonical repo on main; 'yes'/'no' force it

jobs:
  aws:
    if: ${{ github.event_name == 'schedule' || inputs.aws }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-tests.yaml
    secrets: inherit
    with:
      provider: aws
      tags: ${{ inputs.tags }}
      feature_flags: ${{ inputs.feature_flags || './pkg/feature/ff_edge.yaml' }}
      debug: ${{ inputs.debug || true }}
  azure:
    if: ${{ github.event_name == 'schedule' || inputs.azure }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-tests.yaml
    secrets: inherit
    with:
      provider: azure
      tags: ${{ inputs.tags }}
      feature_flags: ${{ inputs.feature_flags || './pkg/feature/ff_edge.yaml' }}
      debug: ${{ inputs.debug || true }}
  gcp:
    if: ${{ github.event_name == 'schedule' || inputs.gcp }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-tests.yaml
    secrets: inherit
    with:
      provider: gcp
      tags: ${{ inputs.tags }}
      feature_flags: ${{ inputs.feature_flags || './pkg/feature/ff_edge.yaml' }}
      debug: ${{ inputs.debug || true }}

  alicloud:
    if: ${{ github.event_name == 'schedule' || inputs.alicloud }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-tests.yaml
    secrets: inherit
    with:
      provider: alicloud
      tags: ${{ inputs.tags }}
      feature_flags: ${{ inputs.feature_flags || './pkg/feature/ff_edge.yaml' }}
      debug: ${{ inputs.debug || true }}

  notify:
    name: Notify Slack
    needs: [aws, azure, gcp, alicloud]
    if: >
      always() &&
      (inputs.notify == 'yes' ||
       (inputs.notify != 'no' &&
        github.repository == 'kyma-project/cloud-manager' &&
        github.ref_name == 'main'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Get job durations
        id: durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOBS_JSON=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --paginate \
            --jq '.jobs')

          compute_duration() {
            local name_fragment="$1"
            local result="$2"
            if [ "$result" = "skipped" ]; then
              echo "skipped"; return
            fi
            local started completed
            started=$(echo "$JOBS_JSON" | jq -r \
              --arg n "$name_fragment" \
              '[.[] | select(.name | ascii_downcase | contains($n))] | first | .started_at // empty')
            completed=$(echo "$JOBS_JSON" | jq -r \
              --arg n "$name_fragment" \
              '[.[] | select(.name | ascii_downcase | contains($n))] | first | .completed_at // empty')
            if [ -z "$started" ] || [ -z "$completed" ]; then
              echo "N/A"; return
            fi
            local s e diff mins
            s=$(date -d "$started" +%s 2>/dev/null || date -jf "%Y-%m-%dT%H:%M:%SZ" "$started" +%s)
            e=$(date -d "$completed" +%s 2>/dev/null || date -jf "%Y-%m-%dT%H:%M:%SZ" "$completed" +%s)
            diff=$(( e - s ))
            mins=$(( (diff + 59) / 60 ))
            echo "${mins}m"
          }

          echo "aws_dur=$(compute_duration 'test aws' '${{ needs.aws.result }}')" >> "$GITHUB_OUTPUT"
          echo "azure_dur=$(compute_duration 'test azure' '${{ needs.azure.result }}')" >> "$GITHUB_OUTPUT"
          echo "gcp_dur=$(compute_duration 'test gcp' '${{ needs.gcp.result }}')" >> "$GITHUB_OUTPUT"
          echo "alicloud_dur=$(compute_duration 'test alicloud' '${{ needs.alicloud.result }}')" >> "$GITHUB_OUTPUT"

      - name: Gather run metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          # Start time: prefer github.run_started_at, fall back to the run's created_at
          STARTED="$RUN_STARTED_AT"
          if [ -z "$STARTED" ]; then
            STARTED=$(gh api \
              "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --jq '.run_started_at // .created_at // empty')
          fi

          START_EPOCH=""
          if [ -n "$STARTED" ]; then
            START_EPOCH=$(date -u -d "$STARTED" +%s 2>/dev/null || true)
          fi

          # Formatted start time (full UTC date+time); raw value if unparseable
          if [ -n "$START_EPOCH" ]; then
            T=$(date -u -d "@$START_EPOCH" +"%Y-%m-%d %H:%M:%S UTC")
          elif [ -n "$STARTED" ]; then
            T="$STARTED"
          else
            T="unknown"
          fi
          echo "start_time=$T" >> "$GITHUB_OUTPUT"

          # Total duration = now - start
          if [ -n "$START_EPOCH" ]; then
            NOW=$(date -u +%s)
            DIFF=$(( NOW - START_EPOCH ))
            [ "$DIFF" -lt 0 ] && DIFF=0
            H=$(( DIFF / 3600 ))
            M=$(( (DIFF % 3600 + 59) / 60 ))
            if [ "$H" -gt 0 ]; then
              TOTAL="${H}h ${M}m"
            else
              TOTAL="${M}m"
            fi
          else
            TOTAL="N/A"
          fi
          echo "total_dur=$TOTAL" >> "$GITHUB_OUTPUT"

          # Short commit SHA
          echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

          # Associated PR (empty on scheduled runs without a PR)
          PR=$(gh api \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // empty' 2>/dev/null || true)
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "CloudManager E2E test run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} started at ${{ steps.meta.outputs.start_time }} (total ${{ steps.meta.outputs.total_dur }})\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}${{ steps.meta.outputs.pr != '' && format('\nPR: #{0}', steps.meta.outputs.pr) || '' }}\nCommit: ${{ steps.meta.outputs.sha_short }}\n* AWS ${{ steps.durations.outputs.aws_dur }} ${{ needs.aws.result == 'success' && ':white_check_mark:' || needs.aws.result == 'skipped' && ':white_check_mark:' || ':x:' }}\n* Azure ${{ steps.durations.outputs.azure_dur }} ${{ needs.azure.result == 'success' && ':white_check_mark:' || needs.azure.result == 'skipped' && ':white_check_mark:' || ':x:' }}\n* GCP ${{ steps.durations.outputs.gcp_dur }} ${{ needs.gcp.result == 'success' && ':white_check_mark:' || needs.gcp.result == 'skipped' && ':white_check_mark:' || ':x:' }}\n* AliCloud ${{ steps.durations.outputs.alicloud_dur }} ${{ needs.alicloud.result == 'success' && ':white_check_mark:' || needs.alicloud.result == 'skipped' && ':white_check_mark:' || ':x:' }}"
