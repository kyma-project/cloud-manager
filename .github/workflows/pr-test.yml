name: PR Test
run-name: Test ${{ github.event.pull_request.number || github.ref_name }}
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
env:
  PIPELINE: true
jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Build & Test GA
            variant: GA
            ffFile: pkg/feature/ff_ga.yaml
          - name: Build & Test Edge
            variant: Edge
            ffFile: pkg/feature/ff_edge.yaml
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
      - name: Display Go version
        run: go version
      - name: Prepare ff config
        # Secure-by-default: the runtime gates read apiEnabled, not !apiDisabled.
        # Deleting apiDisabled no longer force-enables anything, so positively force
        # apiEnabled on (clear targeting + default enabled) to keep every controller —
        # including the V2 suites — exercised in tests. apiDisabled is removed so tests
        # run the apiEnabled-only path a sovereign operator would ship. The
        # "Assert V2 suites executed" step fails the build if any V2 suite drops.
        run: |
          mkdir -p tmp
          yq '.apiEnabled.targeting = [] | .apiEnabled.defaultRule.variation = "enabled" | del(.apiDisabled)' ${{ matrix.ffFile }} > tmp/ff.yaml
      - name: Build and test
        env:
          FEATURE_FLAG_CONFIG_FILE: ${{ github.workspace }}/tmp/ff.yaml
        run: |
          ./config/sync.sh
          ./docs/contributor/permissions/sort.sh
          go mod tidy
          go mod download
          make build
          make test 2>&1 | tee tmp/test.log
      - name: Assert V2 suites executed
        # Fail closed if a V2 suite silently stops running (e.g. a feature-gate
        # regression under secure-by-default). Greps the captured test log for each
        # expected V2 suite's spec text; Ginkgo prints it under go test -v.
        run: |
          missing=0
          for suite in "GcpNfsVolumeBackup V2" "GcpNfsBackupSchedule V2" "GcpNfsVolumeRestore V2"; do
            if ! grep -qF "$suite" tmp/test.log; then
              echo "::error::expected V2 suite did not execute: $suite"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "one or more V2 suites did not execute — secure-by-default gating regression"; exit 1; }

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.variant }}.out
          path: cover.out
      - name: Check modified files
        run: git diff --exit-code
      - name: Check if test GUIDs are unique
        run: x=$(grep -rEho '[[:xdigit:]]{8}(-[[:xdigit:]]{4}){3}-[[:xdigit:]]{12}'  ./internal | sort | uniq -d); [ -z "${x}" ] || ( echo duplicated GUID detected $x; exit 1; )
