# Non-parity fixture: apiEnabled=FALSE for the nfsBackup feature (defaultRule: disabled).
#
# Discriminating property:
#   new guard:  feature.ApiEnabled.Value()  = false  → ApiNotEnabled (skips)
#
# Any test that records "ApiNotEnabled" with this fixture proves the guard reads apiEnabled.
apiEnabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled
