# Provider-scoped GA allowlist — one rule per GA provider.
#   - name: Exclude trial from GA rollout
#     query: brokerPlan == "trial"
#     variation: disabled
#   - name: Enable <Provider1> GA
#     query: provider == "<p1>" and feature in [...]
#     variation: enabled
#   - name: Enable <Provider2> GA
#     query: provider == "<p2>" and feature in [...]
#     variation: enabled
#   defaultRule: { variation: disabled }
# Unlisted providers (openstack, alicloud) are off by default: no rule, no access.
# defaultRule disabled is the fail-safe; removing it voids the shape lint.
# foundation/unknown are always-on via isAlwaysEnabledApi (ffApiGate.go), not this block
# (except on trial, where the trial rule below still applies).
apiEnabled:
  variations:
    enabled: true
    disabled: false
  targeting:
    - name: Exclude trial from GA rollout
      query: brokerPlan == "trial"
      variation: disabled

    - name: Enable GCP GA
      query: provider == "gcp" and feature in ["nfs", "peering", "redis"]
      variation: enabled

    - name: Enable AWS GA
      query: provider == "aws" and feature in ["nfs", "peering", "redis"]
      variation: enabled

    - name: Enable Azure GA
      query: provider == "azure" and feature in ["peering", "redis"]
      variation: enabled
  defaultRule:
    variation: disabled

nukeBackupsGcp:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

nukeBackupsAws:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

vpcPeeringSync:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

nfs41Gcp:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

runtimeSecurityAws:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

runtimeSecurityAzure:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

runtimeSecurityGcp:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

alicloud:
  variations:
    enabled: true
    disabled: false
  targeting:
    - name: Enable for AliCloud provider
      query: provider == "alicloud"
      variation: enabled
  defaultRule:
    variation: disabled
