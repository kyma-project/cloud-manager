# Provider-scoped GA allowlist. Unlisted providers (openstack, alicloud) are off by default.
# Bootstrap kind-group is unconditionally on. foundation/unknown are always-on in Go unless
# an explicit tenant deny rule (e.g. brokerPlan == "trial") matches; tenant denies live here.
# defaultRule disabled is the fail-safe; the shape lint requires it.
apiEnabled:
  variations:
    enabled: true
    disabled: false
  targeting:
    - name: Exclude trial from GA rollout
      query: brokerPlan == "trial"
      variation: disabled

    - name: Enable GCP GA
      query: provider == "gcp" and feature in ["nfs", "peering", "redis"]
      variation: enabled

    - name: Enable AWS GA
      query: provider == "aws" and feature in ["nfs", "peering", "redis"]
      variation: enabled

    - name: Enable Azure GA
      query: provider == "azure" and feature in ["peering", "redis"]
      variation: enabled
  defaultRule:
    variation: disabled

nukeBackupsGcp:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

nukeBackupsAws:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

vpcPeeringSync:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

nfs41Gcp:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

runtimeSecurityAws:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

runtimeSecurityAzure:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

runtimeSecurityGcp:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

alicloud:
  variations:
    enabled: true
    disabled: false
  targeting:
    - name: Enable for AliCloud provider
      query: provider == "alicloud"
      variation: enabled
  defaultRule:
    variation: disabled
